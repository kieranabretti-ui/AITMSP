<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2220" />
    <title>A-IT — Managed Cybersecurity &amp; Monitoring for UK Businesses</title>
    <meta
      name="description"
      content="A-IT is a UK managed cybersecurity and monitoring provider for small and medium businesses. Proactive protection, patching and 24/7 monitoring on Silver and Gold, from £8 per device per month."
    />

    <!-- PLACEHOLDER: replace a-it.example with the real domain once live,
         here and in public/sitemap.xml + public/robots.txt -->
    <link rel="canonical" href="https://a-it.example/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A-IT" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://a-it.example/" />
    <meta property="og:title" content="A-IT — Managed Cybersecurity &amp; Monitoring for UK Businesses" />
    <meta
      property="og:description"
      content="A-IT is a UK managed cybersecurity and monitoring provider for small and medium businesses. Proactive protection, patching and 24/7 monitoring on Silver and Gold, from £8 per device per month."
    />
    <meta property="og:image" content="https://a-it.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A-IT — managed cybersecurity and monitoring for UK small and medium businesses" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A-IT — Managed Cybersecurity &amp; Monitoring for UK Businesses" />
    <meta
      name="twitter:description"
      content="A-IT is a UK managed cybersecurity and monitoring provider for small and medium businesses. Proactive protection, patching and 24/7 monitoring on Silver and Gold, from £8 per device per month."
    />
    <meta name="twitter:image" content="https://a-it.example/og-image.png" />
    <meta name="twitter:image:alt" content="A-IT — managed cybersecurity and monitoring for UK small and medium businesses" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-body antialiased">
    <div id="root"></div>

    <!-- Static mirror of the Contact page form, purely so Netlify's
         build-time crawler can detect and register it — the real form
         only exists once React renders, which is too late for that
         crawler to see. Never shown to a visitor. Field names must
         stay in sync with src/pages/Contact.jsx. -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="website" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="devices" />
      <textarea name="message"></textarea>
      <input type="text" name="website" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
