[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router uses clean client-side URLs (e.g. /pricing, /services) —
# without this, a direct visit or refresh on those paths 404s, because
# Netlify would otherwise only know the physical files in dist/.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. Force HTTPS itself is a one-click toggle in the
# Netlify dashboard (Site configuration → Domain management → HTTPS)
# once a custom domain and certificate are attached — it isn't
# something set here. HSTS below reinforces that once HTTPS is live.
#
# The CSP is scoped to what this site actually loads (Google Fonts,
# GA4, and — on /dorset-it-support and its thank-you page only, but
# the CSP header itself is site-wide since Netlify headers can't be
# conditioned on route — the Google Ads conversion tag) — if you add
# another third-party script/embed later, it needs adding here too, or
# the browser will silently block it. Check the browser console after
# deploying to confirm nothing's blocked; Google's ad-pixel endpoints
# in particular aren't exhaustively documented up front — the
# googletagmanager.com/{a,td} beacon pixels, the doubleclick.net
# view-through-conversion *script* (not just a fetch/beacon target),
# and the googleadservices.com pixel needing img-src as well as
# connect-src all only surfaced from real CSP violations in the
# browser console after deploying, not from documentation. A CSP
# violation here shows up as a silently-missing conversion, not an
# error the visitor sees — so re-check the console after any change to
# what this page loads.
# `preload` is deliberately left off HSTS: it's a long-term, hard-to-
# reverse commitment (submitted to browsers' built-in preload list) —
# only add it once you're certain this domain is HTTPS-only for good.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://googleads.g.doubleclick.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
